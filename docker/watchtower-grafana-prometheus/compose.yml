version: '3.7'

services:
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8888:8080
    command: --interval 10 --http-api-metrics --http-api-token demotoken --debug prometheus grafana parent child
  prometheus:
    user: "0"
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - /app/prometheus/:/etc/prometheus/
      - /app/prometheus:/prometheus/
    ports:
      - 9090:9090
  grafana:
    user: "0"
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - 3030:3000
    environment:
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - /app/grafana:/var/lib/grafana
      - /app/grafana:/etc/grafana/provisioning
  parent:
    image: nginx
    container_name: parent
  child:
    image: nginx:alpine
    labels:
      com.centurylinklabs.watchtower.depends-on: parent
    container_name: child